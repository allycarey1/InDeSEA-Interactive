<script>
const content = {
  stat1: `
    <strong>Religious and Cultural Beliefs</strong><br><br>
    There is a strong presence of religion, particularly Catholicism, and traditionally more conservative beliefs surrounding sex and sexual health in the Cusco region. <br><br>
    "En mi religión, aprendemos que no debe tener relaciones sexuales antes de estas casada. Mi comunidad todavía no sabe sobre el embarazo." - Mother, age 18
    <div class="citation">Qualitative Interview Themes, InDeSEA, 2026</div>
  `,
  stat2: `
    <strong>Distrust in Health System</strong><br><br>
    Many participants reported feeling scared or unsure about visiting a health center in the Cusco region. <br><br>
    
     “Tenía miedo de ir a la posta medica antes de tener 7 meses embarazada.” - Mother, age 17
    <div class="citation">Qualitative Interview Themes, InDeSEA, 2026</div>
    `
,
  stat3: `
    <strong>Lack of Transportation Access</strong><br><br>
    Remote villages, lack of transportation infrastructure, and limited rural health centers are all barriers to accessing healthcare in the Cusco region. <br><br>
    
    “Tuve aceso a la atención prenatal, la atención médica, y el apoyo emocional en Calca. Pero Calca está muy lejos.” - Mother, age 14
    <div class="citation">Qualitative Interview Themes, InDeSEA, 2026</div>
  `
  ,
  stat4: `
    <strong>Low Socioeconomic Status</strong><br><br>
    Rural Cusco, including the Sacred Valley, experiences high poverty rates with many people lacking access to basic resources. This is particularly true 
    for the indigenous population of the Andean highlands; in 2010, it was estimated the 78% of children whose first language was Quechua or Aymara 
    lived in poverty (UNICEF). <br><br>
 
    A significant difference in access to fruits and vegetables was seen between case group (60%) and the control group (93%), p = 0.002. 
    <div class="citation">UNICEF, 2010; Qualitative Interview Themes, InDeSEA, 2026</div>
  `
    ,
  stat5: `
    <strong>Financial Dependence on Partner</strong><br><br>
    Many participants reported depending on their partner for money. According to a 2023 INEI report,
    Peruvian women are three times less likely than men to have their own income in rural areas. <br><br>
    
    "Mi pareja toma las decisiones sobre el dinero." - mother, age 18
    <div class="citation">INEI, 2023; Qualitative Interview Themes, InDeSEA, 2026</div>
  `
    ,
  stat6: `
    <strong>Older Male Partner</strong><br><br>
   Although limited, existing literature has demonstrated a positive correlation between partner age gap and adolescent pregnancy in low- and middle-income countries (Huda et al., 2022). 
    Amongst participants in InDeSEA, several young mothers reported having a partner who was significantly older in age. <br><br> In this study, the average age of case participant was 17.8 (SD ± 1.4), 
    while the average reported partner age was 21 (SD ± 2). 
    <div class="citation">Huda et al, 2022; Qualitative Interview Themes, 2026</div>
  `
    ,
  stat7: `
    <strong>Sex Stigma</strong><br><br>
    Participants reported that stigma and taboo surrounding sex and sexual health is prominent in their communities. <br><br>
    
    “En mi comunidad no se da mucho a conocer sobre estos temas por que es algo delicado por lo tanto nadie habla tan fluido sobre eso.” - control participant, age 16
    <div class="citation">Qualitative Interview Themes, InDeSEA, 2026</div>
  `
    ,
  stat8: `
    <strong>Lack of Access to Healthcare and Pharmacies</strong><br><br>
    
    Across both case and control participants in the InDeSEA study, only 43% reported having access to medicine, 
    and only 55% reported having access to medical attention.
    
    <div class="citation">Quantitative Survey Themes, InDeSEA, 2026</div>
  `
    ,
  stat9: `
    <strong>Power Dynamic and Partner Authority</strong><br><br>
    A combination of older partner age, financial dependence, and gender norms create a power dynamic between women and their partner. <br><br>
    This is reflected in Peru's high rates of IPV and femicide. A 2019 Demographic and Family Health Survey in Peru estimated that 57.7% of women between 15 and 49
    years old experienced IPV. It also reported that these rates are even higher -  62.5% - amongst indigenous women.
    
    <div class="citation">Qualitative Interview Themes, InDeSEA, 2026</div>
  `
   ,
  stat10: `
    <strong>Lack of Communication within Families about Sex</strong><br><br>
    Qualitative interview data indicated a lack of communication about reproductive health within families. <br><br>
    
    "Nunca hablé sobre el sexo con mi familia, ni los anticonceptivos." - Mother, age 18 <br><br>
    “No aprendí nada de mi familia. Mi mamá, preocupada, me dijo que tendría que enfrentar las consecuencias.” - Mother, age 18
    
    <div class="citation">Qualitative Interview Themes, InDeSEA, 2026</div>
  `
    ,
  stat11: `
    <strong>Lack of SRH education in schools</strong><br><br>
    Qualitative interview data indicated a lack of comprehensive sexual health education within schools. Many reported
    learning fragmented or even incorrect information about sexual health. <br><br>
    
    “Casi nunca nos explicaron sobre los anticonceptivos. Tampoco sobre el aborte. Nada sobre las relaciones saludables.” - Mother, age 18 <br><br>
    “No aprendí nada porque no llevamos el curso de sexualidad.” - Control participant, age 16

    <div class="citation">Qualitative Interview Themes, InDeSEA, 2026</div>
  `
   ,
  stat12: `
    <strong>Teen's mother had child at young age</strong><br><br>
  Across 47 reponses, participants' mothers had their first child at an average age of 19.9 years old. 
    <div class="citation">Quantitative Survey Themes, InDeSEA, 2026</div>
  `
   ,
  stat13: `
    <strong>Lack of knowledge surrounding sex and contraceptives</strong><br><br>
Participants reported limited and/or incorrect knowledge surrouding reproductive health. <br><br>
"Bueno también (el uso de anticonceptivos) es malo porque son cancerígenas más que todo en las mujeres" - Control participant, age 15 <br><br>
"Antes de me quedó embarazada, no sabía que eran los anticonceptivos." - Mother, age 19

    <div class="citation">Qualitative Interview Themes, InDeSEA, 2026</div>
  `
  ,
  stat14: `
    <strong>Lack of contraceptive access</strong><br><br>
    Participants reported being unable or unwilling to visit health centers for contraceptives.<br><br>
    Across both case and control groups, 36% of participants reported having access to a health center for contraceptives, but never having visited. 
    21% reported not having access to a health center for contraceptives at all. <br><br>
    
"No tengo una tienda de anticonceptivos" - Mother, age 19
    <div class="citation">Qualitative Themes and Quantitative Survey Data, InDeSEA, 2026</div>
  `
  ,
  stat15: `
    <strong>Lack of complete reproductive autonomy/control over contraceptive use</strong><br><br>
    Many young mothers reported mixed reactions and expectations from their family, partner, and community. 
    Power dynamics, gender norms, and lack of options can reduce a woman's agency over her health and reproductive decisions. <br><br>
    “Mi mamá, se preocupo, me dijo que tendría que enfrentar las consecuencias. Mi papas son separados, no hablo con mi papá.
    Mi pareja se alegro y decidio que si queria tenerlo. Yo más bien estaba en duda pero mi mama me 
    dijo que no haga nada como abortar. Mis amigos estuvieron sorprendidos pero ninguno me insistió en nada.” - Mother, age 18

    <div class="citation">Qualitative Interview Themes, 2026</div>
  `
   ,
  stat16: `
    <strong>Teen pregnancy normalized</strong><br><br>

    <div class="citation">Qualitative Interview Themes, 2026</div>
  `
   ,
  stat17: `
    <strong>Lack of contraceptive use during sex</strong><br><br>
30% of responses across both case and control groups indicated no use of contraceptives.  <br><br>

"No usemos anticonceptivos " - Mother, age 16 <br><br>
"Nadie toma las decisiones sobre el uso de anticonceptivos; no las usamos." - Mother, age 19 <br><br>
"La mayoría no usan anticonceptivos." - Mother, age 19
    <div class="citation">Qualitative Themes, Quantitative Survey Data, InDeSEA 2026</div>
  `
   ,
  stat18: `
    <strong>Teen pregnancy incidence</strong><br><br>
 Peru has a high incidence of adolescent pregnancy, especially in rural areas. Between 2015 and 2019, approximately 3 out of 10 sexually-active adolescents in Peru had at least one pregnancy (Caira-Chuquineyra et al., 2015-2019). <br><br> 
 In 2017, rural Cusco’s fertility rate was 60 per 1000 women, while urban Cusco’s was 26 (UNFPA Peru).
    <div class="citation">UNFPA Perú; Caira-Chuquineyra et al., 2015-2019.</div>
  `
};

function openPopup(id) {
  document.getElementById("popup-content").innerHTML = content[id];
  document.getElementById("popup").style.display = "block";
}

function closePopup() {
  document.getElementById("popup").style.display = "none";
}
</script>
